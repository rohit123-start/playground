choices:

  answer_model:
    type: choice
    instructions: Which model should write the reply to this request, if any?
    criteria:
      gpt-6-astra: >-
        Long agent runs that use many tools or operate a terminal or computer, large
        code migrations, high-stakes work where a factual mistake would be costly, a
        single very hard problem that needs long careful thought such as difficult
        logic or tricky quantitative analysis, and math: proofs, equations,
        derivations, or competition-level problems. Also work on content from a
        provided file, image, audio, or video: extracting data, tables, or key
        fields from it, converting it to another format, or turning a transcript
        into clean text.
      claude-opus-5-5: >-
        Most requests: questions, explanations, advice, in-depth analysis,
        research-style knowledge work, long-form writing, coding, and system design;
        polished customer-facing replies and business documents; classifying,
        extracting, tagging, or labeling information from text; and creative writing
        such as stories, screenplays, dialogue, roleplay, and characters. Also work
        on content from a provided file, image, audio, or video: summarizing it,
        answering questions about it, explaining or analyzing it, or rewriting it.
      kimi-k3: >-
        The request is in Chinese or is bilingual Chinese/English, or it is
        long-horizon coding across a large repository, or it involves a very long
        document.
      none: >-
        Requests where another model's output is the whole reply: generating or
        editing an image, video, or audio; or a question answered entirely by
        looking things up online, such as news, recent events, prices, or facts that
        may have changed. Requests to make something from web results, such as a
        PDF, report, or code, do not count, and neither do requests to summarize,
        transcribe, analyze, or answer questions about a provided file, image,
        audio, or video.

  search_model:
    type: choice
    instructions: Which model should search the web for this request, if any?
    criteria:
      none: >-
        Anything that can be answered or made without looking things up online,
        including requests to create or edit an image, video, or audio.
      perplexity-sonar-pro: >-
        Questions about recent events, news, prices, or facts that may have changed,
        answered by combining several sources with citations.
      perplexity-sonar-pro-search: >-
        A question that needs several searches in a row, where later searches depend
        on what earlier ones found.
      perplexity-sonar-deep-research: >-
        The user wants an exhaustive research report or a thorough investigation of
        a topic and is willing to wait for it.
      grok-4.7: >-
        What people are saying on X or social media right now: trending topics,
        viral posts, hashtags, or public reactions to an event.

  image_model:
    type: choice
    instructions: Which model should generate or edit the image in this request, if any?
    criteria:
      none: >-
        Anything other than making or changing an image, including questions about
        pictures and requests for only a video or audio.
      gemini-3-pro-image: >-
        Any image to generate or edit, including legible text, many reference
        images, and production-ready assets.

  video_generation_model:
    type: choice
    instructions: Which model should generate the video in this request, if any?
    criteria:
      none: >-
        Anything other than making a new video, including questions about videos and
        requests for only an image or audio.
      veo-3.1-generate-preview: >-
        Any video to generate, including cinematic clips with synchronized dialogue.

  video_editing_model:
    type: choice
    instructions: Which model should edit the video in this request, if any?
    criteria:
      none: >-
        Anything other than changing an existing video the user provides.
      runway-aleph-2: >-
        Any video edit: restyling, relighting, swapping a product, or consistent
        edits across shots, on clips up to 30 seconds.

  audio_generation_model:
    type: choice
    instructions: Which model should generate the audio in this request, if any?
    criteria:
      none: >-
        Anything other than making new audio such as speech, a song, or music,
        including questions about music or audio.
      qwen-audio-3.0-tts-plus: >-
        Spoken voice: text to speech, narration, voiceover, audiobooks,
        broadcast-style reading, Chinese dialects, or speech with delivery cues such
        as whispering or laughing.
      lyria-3-pro-preview: >-
        Music: songs with sung vocals or instrumental tracks, soundtracks, and
        pieces where the user specifies detailed musical control.
      elevenlabs-music-v2: >-
        Music that must be cleared for commercial use, or a song that switches genre
        partway through.

  audio_editing_model:
    type: choice
    instructions: Which model should edit the audio in this request, if any?
    criteria:
      none: >-
        Anything other than changing an existing audio file the user provides.
      elevenlabs-music-v2: >-
        Any edit to an existing song or track, such as changing or replacing a
        section.
