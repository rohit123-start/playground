choices:

  answer_model:
    type: choice
    instructions: Which model should write the reply to this request, if any?
    criteria:
      gpt-6.1-sol: >-
        Agent work that automates a workflow across several tools or steps,
        operating a computer, technical and scientific tasks, and pure coding tasks
        for an agent to carry out in a terminal: write, fix, refactor, test, or
        debug code with no general conversation needed.
      gpt-5.6-terra: >-
        Analysis of long documents, contracts, transcripts, or knowledge bases,
        business process automation, and classifying, extracting, tagging, or
        labeling information from text or documents. Also work on content from a
        provided file, image, audio, or video: extracting data, tables, or key
        fields from it, converting it to another format, or turning a transcript
        into clean text.
      claude-sonnet-5-5: >-
        Most requests: questions, explanations, advice, writing and rewriting,
        everyday coding, command-line work, and professional deliverables; also
        creative writing such as stories, screenplays, dialogue, roleplay, and
        characters. Also work on content from a provided file, image, audio, or
        video: summarizing it, answering questions about it, explaining or analyzing
        it, or rewriting it.
      grok-4.7: >-
        Legal analysis, quick one-shot scripts, and system design questions such as
        concurrency, scalability, or distributed systems.
      qwen3.8-max-0902: >-
        The request is in Chinese or bilingual, or it has many strict formatting or
        instruction constraints, or it involves reading papers, or quick UI
        prototyping.
      glm-5.3: >-
        Cybersecurity work such as finding or analysing vulnerabilities, changes
        across many files in a repository, or long-horizon coding agents.
      gemini-3.1-pro-preview: >-
        Math: proofs, equations, derivations, or calculations; also abstract
        reasoning and logic puzzles.
      none: >-
        The request only asks to generate or edit an image, video, or audio, and
        that output is the whole reply. Requests to summarize, transcribe, analyze,
        or answer questions about a provided file, image, audio, or video do not
        count.

  search_model:
    type: choice
    instructions: Which model should search the web for this request, if any?
    criteria:
      none: >-
        Anything that can be answered or made without looking things up online,
        including requests to create or edit an image, video, or audio.
      perplexity-sonar-reasoning-pro: >-
        Questions about recent events, news, prices, or facts that may have changed,
        including ones that need reasoning and an analytical answer with citations.

  image_model:
    type: choice
    instructions: Which model should generate or edit the image in this request, if any?
    criteria:
      none: >-
        Anything other than making or changing an image, including questions about
        pictures and requests for only a video or audio.
      gpt-image-2.5-sunburst: >-
        Precise targeted edits, product imagery, or a series of revisions that must
        keep the same subject consistent across several turns.
      gpt-image-2.5-flare: >-
        Fast concept drafts, social images, and quick visual exploration while the
        user is still trying ideas.
      gemini-3.1-flash-image: >-
        Most images and edits; also images with text in a language other than
        English, very high resolution (up to 4K), or real-world subjects that need
        up-to-date reference.
      qwen-image-3.0-pro: >-
        Dense layouts such as infographics, multi-panel grids, exam sheets, or
        posters with very small readable text or formulas, and restoring damaged
        images.

  video_generation_model:
    type: choice
    instructions: Which model should generate the video in this request, if any?
    criteria:
      none: >-
        Anything other than making a new video, including questions about videos and
        requests for only an image or audio.
      wan3.0-video: >-
        Most video requests; also clips longer than 15 seconds (up to 30),
        characters who must stay consistent, or characters speaking in several
        languages.
      seedance-2.0: >-
        A scene built from several reference images, videos, or audio clips, or
        characters speaking with lip-synced dialogue.
      kling-v3.0-pro: >-
        4K output, or a multi-shot storyboard with cinematic 1080p or higher scenes.
      runway-gen-4.5: >-
        Realistic physics and motion such as flowing water or heavy objects, or
        expressive, stylized characters.
      kling-v3.0-motion-control: >-
        An exact camera path, or movement copied from a reference video or precisely
        choreographed.
      kling-v3.0-turbo: >-
        Fast, dialogue-ready clips with sound included, or many clips at once.
      seedance-2-fast: >-
        A quick, low-cost 720p draft where speed matters more than quality.

  video_editing_model:
    type: choice
    instructions: Which model should edit the video in this request, if any?
    criteria:
      none: >-
        Anything other than changing an existing video the user provides.
      seedance-2.0: >-
        Most video edits, especially high-quality output, dialogue, or edits guided
        by several reference images.
      seedance-2-fast: >-
        A quick, simple 720p edit where speed matters more than quality.

  audio_generation_model:
    type: choice
    instructions: Which model should generate the audio in this request, if any?
    criteria:
      none: >-
        Anything other than making new audio such as speech, a song, or music,
        including questions about music or audio.
      elevenlabs-v2.5-turbo: >-
        Spoken voice: text to speech, voiceover, narration, or conversational voice.
      lyria-3.5: >-
        Music: songs with vocals, instrumentals, soundtracks, or background music
        from 30 seconds to 3 minutes.

  audio_editing_model:
    type: choice
    instructions: Which model should edit the audio in this request, if any?
    criteria:
      none: >-
        Anything other than changing an existing audio file the user provides.
      lyria-3.5: >-
        Edits to an existing music track, such as changing, replacing, or extending
        a section.
