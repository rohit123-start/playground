choices:

  answer_model:
    type: choice
    instructions: Which model should write the reply to this request, if any?
    criteria:
      glm-5.3-flash: >-
        Most requests: general questions, explanations, and everyday coding; also
        reading text from screenshots or scanned documents, and multi-step tasks
        that use tools, browse a website, call an API, or work through a document
        step by step.
      gemini-3.8-flash: >-
        Analysis, including finance or legal analysis, multi-step science or
        engineering reasoning, system design and architecture questions such as
        scalability, concurrency, race conditions, or deadlocks, and questions about
        attached videos, audio, or PDFs.
      deepseek-v4.1-flash: >-
        Math: equations, proofs, derivations, or calculations; coding tasks,
        including pure coding with no explanation or conversation needed; and
        finding information inside a very long text.
      qwen3.8-flash: >-
        Questions about what is in an attached image, such as identifying or
        locating objects; building web pages, landing pages, UI components, or
        dashboards, including from a design or screenshot.
      gpt-6-luna: >-
        Writing tasks such as an email, a rewrite, or a short essay; creative
        writing such as stories, dialogue, roleplay, or characters; and classifying,
        extracting, tagging, or labeling information from text or documents.
      claude-haiku-4-5: >-
        Very simple questions where the fastest possible reply matters most.
      none: >-
        The request only asks to generate or edit an image, video, or audio, and
        that output is the whole reply.

  search_model:
    type: choice
    instructions: Which model should search the web for this request, if any?
    criteria:
      none: >-
        Anything that can be answered or made without looking things up online,
        including requests to create or edit an image, video, or audio.
      perplexity-sonar: >-
        Questions about recent events, news, prices, or facts that may have changed,
        needing a short answer with citations.
      perplexity-search: >-
        The user explicitly asks for links, sources, or a list of web pages about a
        topic.

  image_model:
    type: choice
    instructions: Which model should generate or edit the image in this request, if any?
    criteria:
      none: >-
        Anything other than making or changing an image, including questions about
        pictures and requests for only a video or audio.
      gemini-3.1-flash-lite-image: >-
        Most everyday images and quick edits at standard resolution, including
        thumbnails.
      qwen-image-3.0: >-
        Images that must contain small readable text, formulas, or text in several
        languages, such as infographics or labeled diagrams.
      grok-imagine-image: >-
        Quick mockups and social media graphics.
      flux-2-turbo: >-
        Rough drafts or many variations while the user is still iterating, or images
        larger than standard size (up to 2048 pixels).
      wan2.7-image: >-
        Combining several reference images into one, or matching exact brand colors.

  video_generation_model:
    type: choice
    instructions: Which model should generate the video in this request, if any?
    criteria:
      none: >-
        Anything other than making a new video, including questions about videos and
        requests for only an image or audio.
      gemini-omni-1.1-flash: >-
        Most video requests; also extending an existing clip into a longer scene.
      grok-imagine-video: >-
        Short social media clips, or turning a still image into a short video.
      veo-3.1-fast-generate-001: >-
        A finished-quality 1080p clip with synchronized sound.
      kling-v3.0-std: >-
        A clip that must start and end on specific images the user provides.
      seedance-2.0-mini: >-
        Product videos for e-commerce, user-generated-content style clips, or many
        ad variants at once.
      veo-3.1-lite-generate-preview: >-
        A cheap rough preview of an idea before making the real clip.

  video_editing_model:
    type: choice
    instructions: Which model should edit the video in this request, if any?
    criteria:
      none: >-
        Anything other than changing an existing video the user provides.
      gemini-omni-1.1-flash: >-
        Most video edits; also extending a scene or adding a transition.
      grok-imagine-video: >-
        A quick edit to a short social clip.
      seedance-2.0-mini: >-
        Edits to product or e-commerce style clips, or many variants at once.

  audio_generation_model:
    type: choice
    instructions: Which model should generate the audio in this request, if any?
    criteria:
      none: >-
        Anything other than making new audio such as speech, a song, or music,
        including questions about music or audio.
      gemini-3.8-flash-tts: >-
        Most speech: narration, audiobooks, dialogue between two speakers, directed
        pace or emphasis, and less common languages.
      gemini-3.8-flash-lite-tts: >-
        Reading a short text aloud, real-time voice replies, or many clips at once.
      qwen-audio-3.0-tts-flash: >-
        Chinese dialects, low-resource languages, or speech where a specific emotion
        or tone is requested.

  audio_editing_model:
    type: choice
    instructions: Which model should edit the audio in this request, if any?
    criteria:
      none: >-
        Anything other than changing an existing audio file the user provides.
      gemini-3.8-flash-tts: >-
        Changes to spoken audio, made by regenerating the speech with the requested
        changes.
